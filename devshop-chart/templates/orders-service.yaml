apiVersion: v1
kind: Service
metadata:
  name: {{ include "devshop.fullname" (dict "name" "orders" "context" .) }}
  labels:
    {{- include "devshop.labels" . | nindent 4}}
    app.kubernetes.io/name: orders
spec:
  type: {{ .Values.orders.service.type }}
  ports:
  - port: {{ .Values.orders.service.port }}
    targetPort: {{ .Values.orders.service.targetPort }}
    name: http
  selector:
    {{- include "devshop.selectorLabels" (dict "name" "orders" "context" .)| nindent 4 }}
