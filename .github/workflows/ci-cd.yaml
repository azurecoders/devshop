# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Github Actions
name: DevShop CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "docker-compose*"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "services/**"

jobs:
  test:
    name: Test Service
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [frontend, api-gateway, products, orders]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: npm test --if-present

      - name: Verify Dockerfile exists
        run: |
          if [ ! -f "services/${{ matrix.service }}/Dockerfile" ]; then
            echo "Dockerfile missing for services/${{ matrix.service }}"
            exit 1
          fi
          echo "Dockerfile found for ${{ matrix.service }}"

  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    strategy:
      matrix:
        service: [frontend, api-gateway, products, orders]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image Tags
        id: tags
        run: |
          # Create tags "latest" + git commit hash (short)
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Image will be tagged as: latest and $SHORT_SHA"

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devshop-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/devshop-${{ matrix.service }}:${{ steps.tags.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
